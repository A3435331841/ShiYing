[project]
name = "shiying"
version = "0.3.0"
description = "拾影：在本机运行的媒体下载工具（Web GUI + 桌面壳）。"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "playwright>=1.50,<2",
    "yt-dlp[default,deno]==2026.8.19",
    "pywebview==6.2.1",
    "requests>=2.32,<3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
