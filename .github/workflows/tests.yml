name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          # macOS 覆盖暂停：macos-14（ARM）在本账号不可用（Actions 注解
          # "The configuration 'macos-14-arm64-us-default' is not supported"），
          # macos-13（Intel）在 run 44636157985 / 44141841428 中四个作业均
          # 排队 24h 后 cancelled，从未产出有效结果。先在可用的 Linux/Windows
          # 上保证回归门禁；待 GitHub 侧 macOS runner 可用时再把标签加回矩阵。
          - ubuntu-latest
          - windows-latest
        python:
          - "3.10"
          # 3.12 为发行包所用解释器，3.13 为本机主力开发环境；两者必须进矩阵，
          # 否则会出现「CI 全绿但发布环境未验证」的盲区。
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
