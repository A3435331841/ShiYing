name: Douyin item live smoke

# Live smoke 依赖真实平台登录态与生产 Chrome、耗时 30-85 分钟，仅手动触发。
# 原先绑定已不存在的临时工作分支的 push 触发是死配置，已移除。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Public Douyin item URLs, separated by whitespace
        required: true
        type: string
        default: >-
          https://www.douyin.com/user/self?modal_id=7684132989608949594
          https://www.douyin.com/user/self?modal_id=7677863372330774922
      observe_profile_item_url:
        description: Optional official profile URL with modal_id and vid for anonymous page-route observation
        required: false
        type: string
        default: ""
      force_signed_detail:
        description: Inject an exact-item primary extractor miss to test real signed fallback (diagnostic only)
        required: false
        type: boolean
        default: false
      force_ssr_detail:
        description: Force real SSR fallback after validating page API responses (implies forced signing; diagnostic only)
        required: false
        type: boolean
        default: false
      baseline_ref:
        description: Git ref for the diagnostic baseline job (must exist in this repository)
        required: false
        type: string
        default: v0.3.0

permissions:
  contents: read

jobs:
  download:
    name: Current / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        os:
          # macOS runner 在本账号不可用，与 tests.yml 的矩阵口径保持一致。
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install FFmpeg and Python dependencies
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ffmpeg
            else
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
          fi
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify production Chrome channel
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            chrome_binary="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          else
            chrome_binary="$(command -v google-chrome || command -v google-chrome-stable || true)"
          fi
          if [[ -z "$chrome_binary" || ! -x "$chrome_binary" ]]; then
            echo "Google Chrome is not available at its standard installation path." >&2
            exit 1
          fi
          "$chrome_binary" --version
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome", headless=True)
              print(f"Production Chrome channel: {browser.version}")
              browser.close()
          PY
      - name: Observe original profile item page without downloading media
        if: ${{ inputs.observe_profile_item_url }}
        continue-on-error: true
        shell: bash
        env:
          OBSERVE_PROFILE_ITEM_URL: ${{ inputs.observe_profile_item_url }}
        run: |
          python scripts/dev/douyin_item_live_smoke.py \
            --observe-profile-item-url "$OBSERVE_PROFILE_ITEM_URL" \
            --report "$RUNNER_TEMP/douyin-profile-observation.json"
      - name: Upload sanitized page observations separately
        if: ${{ always() && inputs.observe_profile_item_url }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: douyin-profile-observation-${{ matrix.os }}
          path: ${{ runner.temp }}/douyin-profile-observation.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run anonymous production discovery and download
        shell: bash
        env:
          INPUT_URLS: ${{ inputs.urls || 'https://www.douyin.com/user/self?modal_id=7684132989608949594 https://www.douyin.com/user/self?modal_id=7677863372330774922' }}
          FORCE_SIGNED_DETAIL: ${{ inputs.force_signed_detail && 'true' || 'false' }}
          FORCE_SSR_DETAIL: ${{ inputs.force_ssr_detail && 'true' || 'false' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          command = [sys.executable, "scripts/dev/douyin_item_live_smoke.py",
                     "--report", os.path.join(os.environ["RUNNER_TEMP"], "douyin-item-report.json")]
          for url in os.environ["INPUT_URLS"].split():
              command.extend(["--url", url])
          if os.environ["FORCE_SIGNED_DETAIL"] == "true":
              command.append("--force-signed-detail")
          if os.environ["FORCE_SSR_DETAIL"] == "true":
              command.append("--force-ssr-detail")
          raise SystemExit(subprocess.call(command))
          PY
      - name: Upload sanitized report only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: douyin-item-live-report-${{ matrix.os }}
          path: ${{ runner.temp }}/douyin-item-report.json
          if-no-files-found: error
          retention-days: 7

  baseline:
    name: Baseline ${{ inputs.baseline_ref || 'v0.3.0' }} / ubuntu-24.04 (diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out previous production version
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref || 'v0.3.0' }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: baseline/requirements.txt
      - name: Install baseline dependencies and current diagnostic CLI
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r baseline/requirements.txt
          python -m pip check
          # 诊断脚本用 parents[2] 定位仓库根，必须放到 dev/ 下；baseline 检出可能没有该目录。
          mkdir -p baseline/scripts/dev
          cp scripts/dev/douyin_item_live_smoke.py baseline/scripts/dev/douyin_item_live_smoke.py
      - name: Verify baseline import and production Chrome channel
        working-directory: baseline
        run: |
          google-chrome --version
          python - <<'PY'
          from pathlib import Path
          import app
          from playwright.sync_api import sync_playwright
          assert Path(app.__file__).resolve().parent == Path.cwd() / "app"
          print("Verified that the diagnostic CLI will use the baseline app.")
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome", headless=True)
              print(f"Production Chrome channel: {browser.version}")
              browser.close()
          PY
      - name: Run baseline anonymous production discovery and download
        working-directory: baseline
        env:
          INPUT_URLS: ${{ inputs.urls || 'https://www.douyin.com/user/self?modal_id=7684132989608949594 https://www.douyin.com/user/self?modal_id=7677863372330774922' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          command = [sys.executable, "scripts/dev/douyin_item_live_smoke.py",
                     "--report", os.path.join(os.environ["RUNNER_TEMP"], "douyin-item-baseline-report.json")]
          for url in os.environ["INPUT_URLS"].split():
              command.extend(["--url", url])
          raise SystemExit(subprocess.call(command))
          PY
      - name: Upload sanitized baseline report only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: douyin-item-baseline-report-ubuntu-24.04
          path: ${{ runner.temp }}/douyin-item-baseline-report.json
          if-no-files-found: error
          retention-days: 7
